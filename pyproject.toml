[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest"
version = "0.1.0"
description = "A/B test simulator and analyser on the UCI Online Retail dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alzahad Nowshad" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "statsmodels>=0.14",
                "matplotlib>=3.8", "openpyxl>=3.1", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter>=1.0"]

[project.scripts]
abtest = "abtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
